<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sultaniqz Admin</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080808;
    font-family: Arial, sans-serif;
    color: white;
}

.login-box {
    width: 90%;
    max-width: 400px;
    padding: 35px 25px;
    background: #111;
    border: 2px solid #ff0033;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255, 0, 51, 0.35);
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #ff0033;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.input-box {
    margin-bottom: 18px;
    text-align: left;
}

.input-box label {
    display: block;
    margin-bottom: 7px;
    color: #ddd;
}

.input-box input {
    width: 100%;
    padding: 14px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #1b1b1b;
    color: white;
    font-size: 16px;
    outline: none;
}

.input-box input:focus {
    border-color: #ff0033;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #ff0033;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:active {
    transform: scale(0.98);
}

.note {
    margin-top: 20px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        Sultani<span>qz</span>
    </div>

    <div class="subtitle">
        ເຂົ້າສູ່ລະບົບ Admin
    </div>

    <div class="input-box">
        <label>ຊື່ຜູ້ໃຊ້</label>
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-box">
        <label>ລະຫັດຜ່ານ</label>
        <input type="password" id="password" placeholder="Password">
    </div>

    <button class="login-btn" onclick="login()">
        ເຂົ້າສູ່ Admin
    </button>

    <div class="note">
        Sultaniqz Admin Panel
    </div>

</div>

<script>
function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "" || password === "") {
        alert("ກະລຸນາປ້ອນ Username ແລະ Password");
        return;
    }

    alert("ລະບົບ Login ຈະຖືກເຊື່ອມຕໍ່ໃນຂັ້ນຕໍ່ໄປ");
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
